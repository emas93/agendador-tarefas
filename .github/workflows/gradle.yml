name: Java CI with Gradle

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8
        env:
          MONGO_INITDB_DATABASE: db_agendador
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: ci_mongo_password
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --username root --password ci_mongo_password --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\""
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SPRING_DATA_MONGODB_URI: mongodb://root:ci_mongo_password@localhost:27017/db_agendador?authSource=admin

    permissions:
      contents: read

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Dar permissão ao Gradle Wrapper
        run: chmod +x gradlew

      - name: Compilar e testar
        run: ./gradlew build

  dependency-submission:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin

      - name: Dar permissão ao Gradle Wrapper
        run: chmod +x gradlew

      - name: Gerar e enviar gráfico de dependências
        uses: gradle/actions/dependency-submission@v6